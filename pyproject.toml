[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allmynd-development"
version = "0.1.0.dev0"
description = "Development workspace for the ALL MY'ND split runtime and semantic engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["allmynd", "semantic_engine", "semantic_engine.lqe_core"]
include-package-data = true

[tool.setuptools.package-data]
semantic_engine = ["word_vectors.bin.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
